# Production stack (DEPLOYMENT_OPS section 2). Run from /srv/billdrop with a .env next to this file.
# Required shell vars: GHCR_OWNER, TAG. Everything else comes from .env (see .env.example).
name: billdrop

x-api: &api
  image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/billdrop-api:${TAG:?set TAG}
  command: ["bun", "run", "src/main.ts", "--role=api"]
  env_file: .env
  restart: unless-stopped
  stop_grace_period: 35s
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - bun
      - -e
      - "fetch('http://localhost:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 15s
  logging: &logging
    driver: json-file
    options: { max-size: "100m", max-file: "5" }

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api1, api2]
    logging: *logging

  # Two explicit API replicas (not `replicas: 2`) so Caddy gets static upstreams with active
  # /ready checks and deploy.sh can restart them one at a time.
  api1:
    <<: *api
  api2:
    <<: *api

  worker:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/billdrop-api:${TAG:?set TAG}
    command: ["bun", "run", "src/main.ts", "--role=worker"]
    env_file: .env
    restart: unless-stopped
    deploy: { replicas: 2 }
    stop_grace_period: 75s # lets in-flight Gemini calls finish
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  postgres:
    image: postgres:17
    restart: unless-stopped
    shm_size: 1g
    env_file: .env # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    # Not published to the host network.
    logging: *logging

  # TODO(A14): continuous WAL archive + nightly base backup to a separate R2 bucket (WAL-G).
  # backup:
  #   image: <wal-g or pgbackrest image>
  #   env_file: backup/.env

volumes:
  pg_data: {}
  caddy_data: {}
  caddy_config: {}
