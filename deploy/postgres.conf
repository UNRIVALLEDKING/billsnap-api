# Postgres 17 tuning. These values assume a 32 GB RAM host (SYSTEM_DESIGN section 7);
# docker-compose.staging.yml overrides them for the small staging box.

listen_addresses = '*'
max_connections = 100            # api pool 10 x 2 + worker pool (10 + 4) x 2; no PgBouncer needed

shared_buffers = 8GB
effective_cache_size = 24GB
work_mem = 32MB
maintenance_work_mem = 1GB
random_page_cost = 1.1

wal_compression = on
max_wal_size = 8GB
checkpoint_timeout = 15min

shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all

