name: Deploy (staging)

on:
  push:
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  APP_DIR: /srv/billdrop

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.meta.outputs.owner }}/billdrop-api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Trust-on-first-use host key; pin it with a STAGING_KNOWN_HOSTS secret if stricter checks are wanted.
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts
      - name: Sync deploy files
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          scp -i ~/.ssh/id_deploy -r deploy/. "deploy@${STAGING_HOST}:${APP_DIR}/"
      - name: Deploy
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          TAG: ${{ needs.build.outputs.tag }}
          OWNER: ${{ needs.build.outputs.owner }}
        run: |
          ssh -i ~/.ssh/id_deploy "deploy@${STAGING_HOST}" \
            "cd ${APP_DIR} && chmod +x deploy.sh && GHCR_OWNER=${OWNER} TAG=${TAG} COMPOSE_FILES='-f docker-compose.yml -f docker-compose.staging.yml' ./deploy.sh"
