name: Deploy to Lightsail (Testing)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-lightsail
  cancel-in-progress: false

env:
  APP_DIR: /home/ubuntu/billsnap

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/billdrop-api:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/billdrop-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync deployment manifests
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_USER: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${SSH_USER}@${LIGHTSAIL_HOST}" "mkdir -p ${APP_DIR}"
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy -r deploy/* "${SSH_USER}@${LIGHTSAIL_HOST}:${APP_DIR}/"

      - name: Execute Lightsail deployment
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          SSH_USER: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
          TAG: ${{ needs.build.outputs.tag }}
          OWNER: ${{ needs.build.outputs.owner }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy "${SSH_USER}@${LIGHTSAIL_HOST}" \
            "cd ${APP_DIR} && chmod +x deploy-lightsail.sh && GHCR_OWNER=${OWNER} TAG=${TAG} ./deploy-lightsail.sh"
