name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: billdrop
          POSTGRES_PASSWORD: billdrop
          POSTGRES_DB: billdrop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U billdrop"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://billdrop:billdrop@localhost:5432/billdrop_test
      TEST_DATABASE_URL: postgres://billdrop:billdrop@localhost:5432/billdrop_test
      S3_ENDPOINT: http://localhost:9000
      R2_ACCESS_KEY_ID: billdrop
      R2_SECRET_ACCESS_KEY: billdrop-dev-secret
      R2_BUCKET: billdrop-test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Service containers cannot pass a command, and MinIO needs `server /data`, so start it here.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=billdrop -e MINIO_ROOT_PASSWORD=billdrop-dev-secret \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO is healthy"
              break
            fi
            sleep 1
          done
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - name: Apply migrations to an empty database
        run: bun run migrate
      - name: Check migrations are in sync with the schema
        run: bunx drizzle-kit check
      - run: bun run test

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: billdrop-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: billdrop-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
